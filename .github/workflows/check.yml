name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: media_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: media_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_ci -d media_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://media_ci:ci-only-not-a-real-secret@127.0.0.1:5432/media_ci_test
      LLM_PROVIDER: mock
      IMAGE_PROVIDER: template
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e backend
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m ruff check backend/app backend/tests backend/alembic --config backend/pyproject.toml
      - run: python -m ruff check scripts/*.py --config backend/pyproject.toml
      - run: pip check
      - run: python scripts/release_check.py
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
