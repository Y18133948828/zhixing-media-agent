[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edu-media-backend"
version = "0.2.0"
description = "Zhixing Media Agent: human-reviewed AI content workflows for education and technical creators"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph==1.0.10",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1", "jinja2>=3.1,<4", "markdown-it-py>=3,<5",
  "bleach>=6.2,<7", "playwright>=1.50,<2",
  "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=25,<26", "pillow>=11,<13",
  "langsmith>=0.14,<1", "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pillow>=11,<13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.tools.image_renderer" = ["templates/*.html"]
"app.api" = ["static/docs/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
